<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Amélie: seu caderno de estudos inteligente.">
<meta name="theme-color" content="#fdf2f0">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22g%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%221%22%20y2%3D%221%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22%23f8c6d2%22%2F%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%23dcebd6%22%2F%3E%3C%2FlinearGradient%3E%3C%2Fdefs%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2216%22%20fill%3D%22url(%23g)%22%2F%3E%3Ctext%20x%3D%2232%22%20y%3D%2246%22%20text-anchor%3D%22middle%22%20font-family%3D%22Georgia%2Cserif%22%20font-style%3D%22italic%22%20font-size%3D%2240%22%20fill%3D%22%23c4577a%22%3EA%3C%2Ftext%3E%3C%2Fsvg%3E">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Amélie</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400;1,9..144,600&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap">
<style>
/* Layout: jardim rosé — aura de fundo em rosa, pêssego, sálvia e lavanda; papel de livro-razão com símbolos matemáticos e flores por cima; conteúdo em painéis de vidro. */
:root{
  --bg:#fdf2f0;
  --aura1:#f8c6d2; --aura2:#fcdcc8; --aura3:#dcebd6; --aura4:#ead9f3;
  --ink:#4b2733; --ink-soft:#87616d; --ink-faint:#b89aa4;
  --accent:#c4577a; --accent-ink:#ffffff; --accent-soft:#f8dbe3;
  --leaf:#7fa27b;
  --glass:rgba(255,255,255,.5); --glass-strong:rgba(255,255,255,.7);
  --glass-line:rgba(255,255,255,.8); --glass-shadow:rgba(150,70,90,.13);
  --hair:rgba(130,60,80,.13);
  --good:#3f8a5c; --warn:#b9781a; --bad:#c03a4c;
  --texture:rgba(125,55,80,.17);
  --flores:var(--flores-claro); --flores-op:.8; --ramo:var(--ramo-claro);
  --f-display:"Fraunces", "Iowan Old Style", Georgia, serif;
  --f-body:"DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#21151a;
  --aura1:#6a2a40; --aura2:#5c3a2c; --aura3:#2f4a36; --aura4:#47305c;
  --ink:#fbe9ee; --ink-soft:#d6b5bf; --ink-faint:#9c7f88;
  --accent:#f3a1ba; --accent-ink:#2b0f19; --accent-soft:#5e2a3c;
  --leaf:#a9c9a3;
  --glass:rgba(58,30,40,.45); --glass-strong:rgba(70,36,48,.68);
  --glass-line:rgba(255,210,225,.16); --glass-shadow:rgba(0,0,0,.35);
  --hair:rgba(255,210,225,.12);
  --good:#7fd0a0; --warn:#f2b45a; --bad:#ff8a9a;
  --texture:rgba(255,205,222,.12);
  --flores:var(--flores-escuro); --flores-op:.5; --ramo:var(--ramo-escuro);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#21151a;
  --aura1:#6a2a40; --aura2:#5c3a2c; --aura3:#2f4a36; --aura4:#47305c;
  --ink:#fbe9ee; --ink-soft:#d6b5bf; --ink-faint:#9c7f88;
  --accent:#f3a1ba; --accent-ink:#2b0f19; --accent-soft:#5e2a3c;
  --leaf:#a9c9a3;
  --glass:rgba(58,30,40,.45); --glass-strong:rgba(70,36,48,.68);
  --glass-line:rgba(255,210,225,.16); --glass-shadow:rgba(0,0,0,.35);
  --hair:rgba(255,210,225,.12);
  --good:#7fd0a0; --warn:#f2b45a; --bad:#ff8a9a;
  --texture:rgba(255,205,222,.12);
  --flores:var(--flores-escuro); --flores-op:.5; --ramo:var(--ramo-escuro);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;min-height:100vh;-webkit-font-smoothing:antialiased}
.aura{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.aura i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.85;animation:float 26s ease-in-out infinite alternate}
.aura i:nth-child(1){width:52vmax;height:52vmax;left:-14vmax;top:-16vmax;background:var(--aura1)}
.aura i:nth-child(2){width:46vmax;height:46vmax;right:-14vmax;top:8vmax;background:var(--aura2);animation-duration:32s}
.aura i:nth-child(3){width:40vmax;height:40vmax;left:18vmax;bottom:-20vmax;background:var(--aura3);animation-duration:38s}
.aura i:nth-child(4){width:26vmax;height:26vmax;right:12vmax;bottom:6vmax;background:var(--aura4);animation-duration:22s}
.aura .texture{position:absolute;inset:0;background:var(--texture);-webkit-mask-size:280px 280px;mask-size:280px 280px;-webkit-mask-repeat:repeat;mask-repeat:repeat}
.aura .flores{position:absolute;inset:0;background-image:var(--flores);background-size:380px 380px;opacity:var(--flores-op)}
.hero-c,.empty{position:relative;overflow:hidden}
.hero-c::before,.empty::before{content:"";position:absolute;right:-12px;bottom:-14px;width:150px;height:112px;background:var(--ramo) right bottom/contain no-repeat;pointer-events:none;opacity:.9}
.hero-c>*,.empty>*{position:relative}
.empty::before{right:auto;left:-20px;transform:scaleX(-1)}
.hero-c .countdown{padding-right:110px}
@media (max-width:600px){.hero-c .countdown{padding-right:0;text-align:left}.hero-c::before{opacity:.45}}
.flor-t{display:inline-block;width:.62em;height:.62em;margin-left:.12em;vertical-align:.45em;background:var(--accent);-webkit-mask:var(--flor-mask) center/contain no-repeat;mask:var(--flor-mask) center/contain no-repeat}
nav.tabs button[aria-selected="true"]::before{content:"";display:inline-block;width:11px;height:11px;margin-right:6px;vertical-align:-1px;background:var(--accent);-webkit-mask:var(--flor-mask) center/contain no-repeat;mask:var(--flor-mask) center/contain no-repeat}
.switch{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.switch select{width:auto;max-width:240px;font-weight:600;padding:7px 10px;background:var(--glass-strong);border-color:var(--glass-line);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.top-right{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
@media (max-width:600px){.top-right{align-items:flex-start}}
@keyframes float{to{transform:translate(4vmax,3vmax) scale(1.08)}}
@media (prefers-reduced-motion:reduce){.aura i{animation:none}*{transition:none!important}}

.wrap{position:relative;z-index:1;max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 60px;display:flex;flex-direction:column;gap:18px}
.glass{background:var(--glass);border:1px solid var(--glass-line);border-radius:22px;box-shadow:0 10px 34px -12px var(--glass-shadow),inset 0 1px 0 var(--glass-line);backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%)}

header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand h1{font-family:var(--f-display);font-weight:400;font-size:clamp(28px,5vw,40px);line-height:1.05;margin:0;letter-spacing:-.01em}
.brand h1 em{font-style:italic;color:var(--accent)}
.brand p{margin:4px 0 0;color:var(--ink-soft);font-size:14px}
.sync{font-size:12px;color:var(--ink-faint);display:flex;align-items:center;gap:6px}
.sync b{width:7px;height:7px;border-radius:50%;background:var(--ink-faint);display:inline-block}
.sync.ok b{background:var(--good)}

nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:4px;padding:6px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{flex:1 0 auto;border:0;background:transparent;color:var(--ink-soft);font:600 14px var(--f-body);padding:10px 16px;border-radius:16px;cursor:pointer;white-space:nowrap;transition:background .2s,color .2s}
nav.tabs button:hover{background:var(--glass)}
nav.tabs button[aria-selected="true"]{background:var(--glass-strong);color:var(--ink);box-shadow:0 2px 10px -4px var(--glass-shadow),inset 0 1px 0 var(--glass-line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}

section.view{display:flex;flex-direction:column;gap:18px}
.grid{display:grid;gap:18px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-3-2{grid-template-columns:minmax(0,3fr) minmax(0,2fr)}
@media (max-width:860px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g2,.g-3-2{grid-template-columns:minmax(0,1fr)}}
.card{padding:20px;min-width:0}
.card h2{font-family:var(--f-display);font-weight:600;font-size:19px;margin:0 0 4px;text-wrap:balance}
.card .sub{color:var(--ink-soft);font-size:13px;margin:0 0 14px}
.eyebrow{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-soft);font-weight:600}
.stat .num{font-family:var(--f-display);font-size:34px;line-height:1.1;font-variant-numeric:tabular-nums;margin-top:6px}
.stat .num small{font-family:var(--f-body);font-size:14px;color:var(--ink-soft);margin-left:3px}
.stat .hint{font-size:12.5px;color:var(--ink-soft);margin-top:4px}
.meter{height:7px;border-radius:9px;background:var(--hair);overflow:hidden;margin-top:10px}
.meter i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--leaf),var(--accent))}

.hero-c{padding:22px 24px;display:flex;justify-content:space-between;align-items:center;gap:18px;flex-wrap:wrap}
.hero-c h2{font-family:var(--f-display);font-weight:400;font-size:clamp(22px,3.4vw,30px);margin:2px 0 0;line-height:1.15;text-wrap:balance}
.hero-c h2 em{color:var(--accent)}
.countdown{text-align:right}
.countdown .d{font-family:var(--f-display);font-size:48px;line-height:1;font-variant-numeric:tabular-nums;color:var(--accent)}
.countdown .l{font-size:12.5px;color:var(--ink-soft)}

.btn{border:1px solid var(--glass-line);background:var(--glass-strong);color:var(--ink);font:600 14px var(--f-body);padding:9px 16px;border-radius:13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:transform .15s,background .2s}
.btn:hover{transform:translateY(-1px)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 11px;font-size:13px;border-radius:10px}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}

label.f{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:600;color:var(--ink-soft);min-width:0}
input,select,textarea{font:15px var(--f-body);color:var(--ink);background:var(--glass-strong);border:1px solid var(--hair);border-radius:11px;padding:9px 11px;width:100%;min-width:0}
textarea{resize:vertical;min-height:70px}
.fgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}

.list{display:flex;flex-direction:column;gap:2px}
.li{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--hair);min-width:0}
.li:last-child{border-bottom:0}
.dot{width:16px;height:16px;flex:none;-webkit-mask:var(--flor-mask) center/contain no-repeat;mask:var(--flor-mask) center/contain no-repeat}
.li .t{flex:1;min-width:0}
.li .t b{font-weight:600;display:block;overflow-wrap:anywhere}
.li .t span{font-size:12.5px;color:var(--ink-soft)}
.pill{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--hair);color:var(--ink-soft);white-space:nowrap}
.pill.hot{background:var(--accent-soft);color:var(--accent)}
.pill.good{color:var(--good)}
.pill.warn{color:var(--warn)}
.pill.bad{color:var(--bad)}

.chart{width:100%;overflow-x:auto}
.chart svg{display:block;width:100%;min-width:420px;height:auto}

.disc{padding:18px 20px}
.disc-head{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.disc-head h3{margin:0;font-family:var(--f-display);font-weight:600;font-size:18px;flex:1;min-width:140px;overflow-wrap:anywhere}
.disc-meta{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-soft);margin-top:8px}
.disc-meta b{color:var(--ink);font-variant-numeric:tabular-nums}
.stars{display:inline-flex;gap:2px}
.stars button{border:0;background:none;padding:0 1px;font-size:17px;cursor:pointer;color:var(--hair);line-height:1}
.stars button.on{color:var(--accent)}
.topics{margin-top:12px;display:flex;flex-direction:column;gap:2px}
.topic{display:flex;align-items:center;gap:10px;padding:6px 2px;font-size:14px}
.topic input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);flex:none;padding:0}
.topic .tn{flex:1;min-width:0;overflow-wrap:anywhere}
.topic.done .tn{color:var(--ink-soft);text-decoration:line-through;text-decoration-color:var(--ink-faint)}
.topic .x{border:0;background:none;color:var(--ink-faint);cursor:pointer;font-size:16px;padding:2px 6px;border-radius:6px}
.topic .x:hover{color:var(--bad)}
details.more summary{cursor:pointer;color:var(--ink-soft);font-size:13px;font-weight:600;margin-top:10px;list-style:none}
details.more summary::-webkit-details-marker{display:none}

.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}
@media (max-width:860px){.week{grid-template-columns:minmax(0,1fr)}}
.day{padding:14px;min-width:0}
.day h4{margin:0 0 8px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);display:flex;justify-content:space-between}
.day.today{outline:2px solid var(--accent);outline-offset:-2px}
.block{border-radius:12px;padding:8px 10px;margin-top:6px;background:var(--glass-strong);border-left:4px solid var(--c);font-size:13px}
.block b{display:block;font-weight:600;overflow-wrap:anywhere}
.block span{color:var(--ink-soft);font-size:12px}
.daypick{display:flex;gap:6px;flex-wrap:wrap}
.daypick label{display:flex;align-items:center;gap:5px;font-size:13px;padding:6px 10px;border-radius:10px;background:var(--glass-strong);border:1px solid var(--hair);cursor:pointer}
.daypick input{width:auto;accent-color:var(--accent)}

.ai-out{white-space:normal;font-size:14.5px;line-height:1.6;min-height:60px}
.ai-out p{margin:0 0 10px}
.ai-out ul{margin:0 0 10px;padding-left:20px}
.ai-out strong{color:var(--accent)}
.muted{color:var(--ink-soft)}
.empty{text-align:center;padding:34px 20px}
.empty h2{font-family:var(--f-display);font-weight:400;font-size:28px;margin:0 0 6px}
.empty p{color:var(--ink-soft);max-width:52ch;margin:0 auto 18px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);opacity:0;padding:10px 18px;border-radius:14px;font-weight:600;font-size:14px;z-index:20;transition:all .25s;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12.5px;padding:5px 11px;border-radius:99px;border:1px solid var(--hair);background:var(--glass-strong);cursor:pointer;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.tnum{font-variant-numeric:tabular-nums}
</style>

<div class="aura" aria-hidden="true"><i></i><i></i><i></i><i></i><div class="texture" id="texture"></div><div class="flores"></div></div>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1><em>Amélie</em><span class="flor-t" aria-hidden="true"></span></h1>
      <p id="subtitle">Seu caderno de estudos inteligente.</p>
    </div>
    <div class="top-right">
      <div class="switch" id="switch"></div>
      <div class="sync" id="sync"><b></b><span>Carregando…</span></div>
    </div>
  </header>

  <nav class="tabs glass" role="tablist" aria-label="Seções">
    <button role="tab" data-tab="painel" aria-selected="true">Painel</button>
    <button role="tab" data-tab="disciplinas" aria-selected="false">Disciplinas</button>
    <button role="tab" data-tab="estudar" aria-selected="false">Registrar estudo</button>
    <button role="tab" data-tab="cronograma" aria-selected="false">Cronograma</button>
    <button role="tab" data-tab="mentora" aria-selected="false">Pergunte à Amélie</button>
    <button role="tab" data-tab="concurso" aria-selected="false">Meu objetivo</button>
  </nav>

  <main id="app"></main>
</div>
<div class="toast glass" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
"use strict";
/* ---------- utilidades ---------- */
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Math.random().toString(36).slice(2,10);
const pad = n => String(n).padStart(2,"0");
const ymd = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const today = () => ymd(new Date());
const parse = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate()+n); return ymd(d); };
const diffDays = (a, b) => Math.round((parse(b) - parse(a)) / 864e5);
const fmtH = min => { const h = Math.floor(min/60), m = Math.round(min%60); return h ? (m ? h+"h"+pad(m) : h+"h") : m+"min"; };
const fmtDate = s => parse(s).toLocaleDateString("pt-BR",{day:"2-digit",month:"short"});
const DIAS = ["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];
const CORES = ["#c4577a","#7fa27b","#e0896a","#9b7cc4","#d9a441","#5f9ea0","#d77fa1","#6f8fc9","#b5536b","#a3b86c"];
const REV = [1, 7, 30]; // revisões espaçadas: 1, 7 e 30 dias depois

/* ---------- textura: papel de livro-razão com símbolos de matemática e contabilidade ---------- */
(function textura(){
  let minor = "", major = "";
  for (let i = 14; i < 280; i += 14) { const l = `M0 ${i}H280M${i} 0V280`; (i % 70 === 0 ? (major += l) : (minor += l)); }
  major += "M0 0H280M0 0V280";
  const sym = [["Σ",26,48,30,-8],["π",122,32,22,6],["∫",228,60,34,0],["÷",184,112,20,0],["√x",38,134,20,-4],["%",112,126,22,8],["x²",250,140,16,0],["Δ",40,224,24,0],["R$",104,202,17,-6],["∞",156,252,24,0],["±",252,252,20,0],["=",78,262,18,0]];
  const txt = sym.map(([s,x,y,f,r]) => `<text x='${x}' y='${y}' font-size='${f}' text-anchor='middle' transform='rotate(${r} ${x} ${y})'>${s}</text>`).join("");
  const svg = `<svg xmlns='http://www.w3.org/2000/svg' width='280' height='280' viewBox='0 0 280 280'>`
    + `<g fill='none' stroke='#000'><path d='${minor}' stroke-opacity='.28' stroke-width='.6'/><path d='${major}' stroke-opacity='.6' stroke-width='.9'/>`
    + `<path d='M150 168H226M188 168V206' stroke-width='1.6'/></g>`
    + `<g fill='#000' font-family='Georgia, Times New Roman, serif' font-style='italic'>${txt}`
    + `<text x='169' y='162' font-size='12' text-anchor='middle'>D</text><text x='207' y='162' font-size='12' text-anchor='middle'>C</text></g></svg>`;
  const url = `url("data:image/svg+xml,${encodeURIComponent(svg)}")`;
  const el = document.getElementById("texture");

const CORES_ANTIGAS = ["#c2457e","#7b4fa8","#e07a5f","#3a8f8a","#d4a017","#5b7fd6","#b5539c","#4f9a62","#d96f9b","#8a6bd1"];
function recolorir(c){ (c.disciplinas || []).forEach(d => { const i = CORES_ANTIGAS.indexOf(d.cor); if (i >= 0) d.cor = CORES[i]; }); return c; }
const VAZIO = () => ({ id:uid(), concurso:null, disciplinas:[], sessoes:[], dias:[1,2,3,4,5,6], minBloco:50 });
const RAIZ = () => { const c = VAZIO(); return { v:2, atual:c.id, cadernos:[c] }; };
function migrar(x){
  if (!x) return RAIZ();
  x = JSON.parse(JSON.stringify(x)); // cópia editável (snapshots do banco vêm congelados)
  if (x.v === 2 && Array.isArray(x.cadernos) && x.cadernos.length) {
    x.cadernos = x.cadernos.map(c => recolorir(Object.assign(VAZIO(), c)));
    if (!x.cadernos.some(c => c.id === x.atual)) x.atual = x.cadernos[0].id;
    return x;
  }
  const c = recolorir(Object.assign(VAZIO(), x)); delete c.v;
  return { v:2, atual:c.id, cadernos:[c] };
}
let R = RAIZ(), S = R.cadernos[0];
function usar(){ S = R.cadernos.find(c => c.id === R.atual) || R.cadernos[0]; R.atual = S.id; }

/* ---------- modelo INSS ---------- */
function modeloINSS(){
  const D = (nome, peso, topicos) => ({ id:uid(), nome, peso, questoes:0, dominio:2, cor:"", topicos: topicos.map(n => ({ id:uid(), nome:n, feito:false, dataFeito:null, rev:0 })) });

    D("Língua Portuguesa", 2, ["Interpretação de texto","Ortografia e acentuação","Classes de palavras","Concordância verbal e nominal","Regência e crase","Pontuação","Reescrita de frases"]),
    D("Direito Constitucional", 2, ["Princípios fundamentais","Direitos e garantias fundamentais","Direitos sociais","Organização do Estado","Administração Pública (art. 37 a 41)","Ordem social: seguridade (art. 194 a 204)"]),
    D("Direito Administrativo", 2, ["Princípios da Administração","Poderes administrativos","Atos administrativos","Organização administrativa","Licitações (Lei 14.133/2021)","Improbidade administrativa","Processo administrativo (Lei 9.784/99)"]),
    D("Lei 8.112/90", 2, ["Provimento e vacância","Direitos e vantagens","Regime disciplinar","Processo administrativo disciplinar"]),
    D("Ética no Serviço Público", 1, ["Decreto 1.171/94","Lei 12.813/2013 (conflito de interesses)"]),
    D("Raciocínio Lógico", 1, ["Proposições e conectivos","Equivalências e negações","Porcentagem e razão","Análise combinatória e probabilidade"]),
    D("Informática", 1, ["Windows e pastas","Editores de texto e planilhas","Internet e correio eletrônico","Segurança da informação"])
  ];
  ds.forEach((d, i) => d.cor = CORES[i % CORES.length]);
  return ds;
}

/* ---------- métricas ---------- */
const discById = id => S.disciplinas.find(d => d.id === id);
function pctTopicos(d){ return d.topicos.length ? d.topicos.filter(t => t.feito).length / d.topicos.length : 0; }
function ultimoEstudo(d){ let u = null; for (const s of S.sessoes) if (s.disc === d.id && (!u || s.data > u)) u = s.data; return u; }
function acertoDisc(d){ let q=0,a=0; for (const s of S.sessoes) if (s.disc === d.id){ q += +s.q||0; a += +s.a||0; } return q ? a/q : null; }
function minutosDisc(d){ return S.sessoes.reduce((t, s) => t + (s.disc === d.id ? +s.min||0 : 0), 0); }
function prioridade(d){
  const u = ultimoEstudo(d);
  const dias = u ? Math.min(diffDays(u, today()), 21) : 21;
  const ac = acertoDisc(d);
  let p = (+d.peso||1) * (6 - (+d.dominio||1)) * (1 + dias/7) * (1 - pctTopicos(d)*0.5);
  if (ac !== null && ac < .7) p *= 1.3;
  return p;
}
function porPrioridade(){ return [...S.disciplinas].sort((a,b) => prioridade(b) - prioridade(a)); }
function inicioSemana(){ const d = new Date(); d.setDate(d.getDate() - ((d.getDay()+6)%7)); return ymd(d); } // segunda
function minutosSemana(){ const ini = inicioSemana(); return S.sessoes.reduce((t,s) => t + (s.data >= ini ? +s.min||0 : 0), 0); }
function sequencia(){
  const dias = new Set(S.sessoes.map(s => s.data));
  let n = 0, d = today();
  if (!dias.has(d)) d = addDays(d, -1);
  while (dias.has(d)) { n++; d = addDays(d, -1); }
  return n;
}
function revisoesPendentes(){
  const hoje = today(), out = [];
  for (const d of S.disciplinas) for (const t of d.topicos) {
    if (!t.feito || !t.dataFeito || t.rev >= REV.length) continue;
    const quando = addDays(t.dataFeito, REV[t.rev]);
    if (quando <= hoje) out.push({ d, t, quando, atraso: diffDays(quando, hoje) });
  }
  return out.sort((a,b) => b.atraso - a.atraso);
}
function totais(){
  let q=0,a=0,min=0; for (const s of S.sessoes){ q+=+s.q||0; a+=+s.a||0; min+=+s.min||0; }
  let tt=0,tf=0; for (const d of S.disciplinas){ tt+=d.topicos.length; tf+=d.topicos.filter(t=>t.feito).length; }
  return { q, a, min, tt, tf, acerto: q ? a/q : null, edital: tt ? tf/tt : 0 };
}

/* ---------- cronograma ---------- */
function gerarCronograma(){
  const c = S.concurso; if (!c || !S.disciplinas.length) return null;
  const dias = (S.dias && S.dias.length) ? [...S.dias].sort() : [1,2,3,4,5];
  const bloco = +S.minBloco || 50;
  const totalBlocos = Math.max(dias.length, Math.round((+c.meta||15) * 60 / bloco));
  const ds = porPrioridade(); const pr = ds.map(prioridade); const soma = pr.reduce((a,b)=>a+b,0) || 1;
  // distribuição proporcional com maiores restos
  const cotas = ds.map((d,i) => ({ d, exata: pr[i]/soma*totalBlocos }));
  cotas.forEach(x => x.n = Math.floor(x.exata));
  let resto = totalBlocos - cotas.reduce((a,x)=>a+x.n,0);
  [...cotas].sort((a,b) => (b.exata-b.n) - (a.exata-a.n)).slice(0, resto).forEach(x => x.n++);
  // intercala: ciclo round-robin
  const fila = []; const restante = cotas.map(x => ({ d:x.d, n:x.n }));
  while (fila.length < totalBlocos){ let add = false; for (const r of restante) if (r.n > 0){ fila.push(r.d); r.n--; add = true; } if (!add) break; }
  const plano = {}; dias.forEach(d => plano[d] = []);
  fila.forEach((d, i) => plano[dias[i % dias.length]].push(d));
  return { plano, bloco, dias };
}

function rel(s){ const n = diffDays(s, today()); return n === 0 ? "hoje" : n === 1 ? "ontem" : "há " + n + " dias"; }

  if (ac !== null && ac < .7) r.push("o acerto está em " + Math.round(ac*100) + "%");
  if (!r.length) r.push("é a que mais rende agora pelo equilíbrio entre peso e progresso");
  return "Porque " + r.join(", ").replace(/, ([^,]*)$/, " e $1") + ".";
}
function chart14(){
  const dias = []; for (let i = 13; i >= 0; i--) dias.push(addDays(today(), -i));
  const v = dias.map(d => S.sessoes.reduce((t,s) => t + (s.data === d ? +s.min||0 : 0), 0));
  const metaDia = S.concurso && S.concurso.meta ? (+S.concurso.meta*60) / ((S.dias||[]).length || 7) : 0;
  const maxV = Math.max(60, ...v, metaDia);
  const top = Math.ceil(maxV / 60) * 60;
  const W = 640, H = 220, L = 38, R = 8, T = 12, B = 30, cw = (W-L-R)/14, h = H-T-B;
  const y = m => T + h - m/top*h;
  let g = "";
  const step = top <= 240 ? 60 : 120;
  for (let m = 0; m <= top; m += step) g += `<line x1="${L}" x2="${W-R}" y1="${y(m)}" y2="${y(m)}" stroke="var(--hair)"/><text x="${L-6}" y="${y(m)+4}" text-anchor="end" font-size="11" fill="var(--ink-soft)">${m/60}h</text>`;
  if (metaDia) g += `<line x1="${L}" x2="${W-R}" y1="${y(metaDia)}" y2="${y(metaDia)}" stroke="var(--accent)" stroke-dasharray="4 4" opacity=".7"/><text x="${W-R}" y="${y(metaDia)-5}" text-anchor="end" font-size="11" fill="var(--accent)">meta/dia</text>`;
  v.forEach((m, i) => {
    const x = L + i*cw + cw*0.18, w = cw*0.64, isT = i === 13;
    if (m > 0) g += `<rect x="${x}" y="${y(m)}" width="${w}" height="${T+h-y(m)}" rx="5" fill="${isT ? "var(--accent)" : "var(--leaf)"}" opacity="${isT?1:.75}"><title>${fmtDate(dias[i])}: ${fmtH(m)}</title></rect>`;
    const dd = parse(dias[i]);
    g += `<text x="${x+w/2}" y="${H-12}" text-anchor="middle" font-size="10.5" fill="${isT?"var(--accent)":"var(--ink-soft)"}">${DIAS[dd.getDay()].slice(0,1)}${dd.getDate()}</text>`;
  });
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Horas estudadas por dia nos últimos 14 dias">${g}</svg></div>`;
}

function md(t){
  const lines = esc(t).split(/\n/); let out = "", ul = false;
  for (let l of lines){
    l = l.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/^#{1,4}\s*(.+)$/, "<strong>$1</strong>");
    if (/^\s*[-*•]\s+/.test(l)){ if (!ul){ out += "<ul>"; ul = true; } out += "<li>" + l.replace(/^\s*[-*•]\s+/, "") + "</li>"; }
    else { if (ul){ out += "</ul>"; ul = false; } if (l.trim()) out += "<p>" + l + "</p>"; }
  }
  return out + (ul ? "</ul>" : "");
}

    if (t) { t.rev = (t.rev||0) + 1; t.dataRev = today(); save(); render(); toast(t.rev >= REV.length ? "Ciclo de revisões concluído" : "Próxima revisão em " + (REV[t.rev] - REV[t.rev-1]) + " dias"); }
  }
  else if (a === "dom") { const d = discById(b.dataset.id); d.dominio = +b.dataset.n; save(); render(); }
  else if (a === "del-top") { const d = discById(b.dataset.d); d.topicos = d.topicos.filter(t => t.id !== b.dataset.t); save(); render(); }
  else if (a === "del-disc") confirmTwice(b, "d"+b.dataset.id, "Confirmar exclusão", () => { S.disciplinas = S.disciplinas.filter(d => d.id !== b.dataset.id); save(); render(); toast("Disciplina excluída"); });
  else if (a === "del-sess") confirmTwice(b, "s"+b.dataset.id, "Confirmar", () => { S.sessoes = S.sessoes.filter(s => s.id !== b.dataset.id); save(); render(); toast("Sessão excluída"); });
  else if (a === "reset") confirmTwice(b, "reset", "Clique de novo para confirmar", () => {
    if (R.cadernos.length > 1) { R.cadernos = R.cadernos.filter(k => k.id !== S.id); R.atual = R.cadernos[0].id; toast("Caderno excluído"); }
    else { R = RAIZ(); toast("Tudo apagado"); }
    usar(); save(); go("painel");
  });
  else if (a === "exportar") {
    const blob = new Blob([JSON.stringify(R, null, 2)], { type:"application/json" });
    const link = document.createElement("a"); link.href = URL.createObjectURL(blob); link.download = "amelie-backup-" + today() + ".json";
    document.body.appendChild(link); link.click(); link.remove(); setTimeout(() => URL.revokeObjectURL(link.href), 1000);
    toast("Backup baixado");
  }
  else if (a === "novo-caderno") { const k = VAZIO(); R.cadernos.push(k); R.atual = k.id; usar(); save(); go("concurso"); }
  else if (a === "ai") { const p = PROMPTS[b.dataset.p]; askAI(p[0], p[1]); }
});

document.addEventListener("change", e => {
  const el = e.target;
  if (el.id === "f-import" && el.files && el.files[0]) {
    el.files[0].text().then(txt => {
      const d = JSON.parse(txt);
      if (!d || !(Array.isArray(d.cadernos) || Array.isArray(d.disciplinas))) throw new Error("formato");
      R = migrar(d); usar(); save(); go("painel"); toast("Backup restaurado");
    }).catch(() => toast("Esse arquivo não é um backup da Amélie"));
    return;
  }
  const a = el.dataset.act; if (!a) return;
  if (a === "caderno") { R.atual = el.value; usar(); estudoPre = null; AI.text = ""; AI.pergunta = ""; save(); render(); }
  else if (a === "topico") {
    const d = discById(el.dataset.d), t = d.topicos.find(x => x.id === el.dataset.t);
    t.feito = el.checked; t.dataFeito = el.checked ? today() : null; t.rev = 0;
    save(); render(); if (el.checked) toast("Primeira revisão agendada para amanhã");
  }
  else if (a === "peso") { discById(el.dataset.id).peso = +el.value; save(); render(); }
  else if (a === "dia") { const n = +el.dataset.n; S.dias = (S.dias||[]).filter(x => x !== n); if (el.checked) S.dias.push(n); save(); render(); }
  else if (a === "bloco") { S.minBloco = +el.value; save(); render(); }
  else if (a === "meta") { const v = +el.value; if (v > 0) { S.concurso.meta = v; save(); render(); } }
});

document.addEventListener("submit", e => {
  e.preventDefault();
  const f = e.target;
  if (f.id === "f-conc") {
    S.concurso = Object.assign(S.concurso || {}, { tipo:$("#c-tipo").value, marco:$("#c-marco").value.trim(), nome:$("#c-nome").value.trim(), cargo:$("#c-cargo").value.trim(), banca:$("#c-banca").value.trim(), data:$("#c-data").value, meta:+$("#c-hmeta").value || 15 });
    save(); toast("Objetivo salvo"); go(S.disciplinas.length ? "painel" : "disciplinas");
  }
  else if (f.id === "f-disc") {
    const nome = $("#d-nome").value.trim(); if (!nome) return;
    const tops = $("#d-top").value.split("\n").map(s => s.replace(/^[\s\-•\d.)]+/, "").trim()).filter(Boolean);
    S.disciplinas.push({ id:uid(), nome, peso:+$("#d-peso").value, questoes:+$("#d-q").value||0, dominio:2, cor:CORES[S.disciplinas.length % CORES.length], topicos: tops.map(n => ({ id:uid(), nome:n, feito:false, dataFeito:null, rev:0 })) });
    save(); render(); toast("Disciplina adicionada");
  }
  else if (f.dataset.form === "add-top") {
    const d = discById(f.dataset.id), inp = $("#nt-" + d.id), n = inp.value.trim(); if (!n) return;
    d.topicos.push({ id:uid(), nome:n, feito:false, dataFeito:null, rev:0 }); save(); render();
    const again = $("#nt-" + d.id); if (again) { again.closest("details").open = true; again.focus(); }
  }
  else if (f.id === "f-sess") {
    const q = +$("#s-q").value || 0, a = Math.min(+$("#s-a").value || 0, q);
    const s = { id:uid(), ts:Date.now(), disc:$("#s-disc").value, data:$("#s-data").value || today(), min:+$("#s-min").value || 0, tipo:$("#s-tipo").value, q, a, obs:$("#s-obs").value.trim() };
    if (!s.min) return;
    S.sessoes.push(s); estudoPre = s.disc; save(); render(); toast("Sessão salva: " + fmtH(s.min));
  }
  else if (f.id === "f-ai") {
    const q = $("#ai-q").value.trim(); if (!q) return;
    askAI("Sua pergunta: " + q, q);
  }
});

initStore();
})();
</script>

</body>
</html>
