<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>

<body>
<title>Amélie</title>
<meta name="claude:viewport-fit-sides" content="cover">

<style>
/* Layout: ateliê botânico — aura de fundo em nude rosé, papel de livro-razão com símbolos matemáticos e flores em traço fino; coluna central arejada; painéis de vidro discretos; serifa clássica itálica nos títulos. */
:root{
  --bg:#f7efec;
  --aura1:#f1d3d8; --aura2:#f4e1d6; --aura3:#e3e8dc; --aura4:#e8def0;
  --ink:#3b2630; --ink-soft:#7d6470; --ink-faint:#ad97a1;
  --accent:#a24d68; --accent-ink:#ffffff; --accent-soft:#f1dde3;
  --leaf:#8aa486;
  --glass:rgba(255,255,255,.42); --glass-strong:rgba(255,255,255,.62);
  --glass-line:rgba(255,255,255,.72); --glass-shadow:rgba(90,40,60,.10);
  --hair:rgba(90,40,60,.12);
  --good:#4f8a63; --warn:#b07a26; --bad:#b4434f;
  --texture:rgba(110,50,75,.11);
  --flores:var(--flores-claro); --flores-op:.7; --ramo:var(--ramo-claro);
  --f-display:"Cormorant Garamond", "Cormorant", Garamond, "Times New Roman", serif;
  --f-body:"Jost", "Futura", "Avenir Next", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1b1418;
  --aura1:#4a2433; --aura2:#3f2c26; --aura3:#26372b; --aura4:#33264a;
  --ink:#f5e8ec; --ink-soft:#c9b1ba; --ink-faint:#8d7680;
  --accent:#e6a3b8; --accent-ink:#2a1119; --accent-soft:#4d2836;
  --leaf:#a2bf9c;
  --glass:rgba(40,24,32,.5); --glass-strong:rgba(58,34,46,.7);
  --glass-line:rgba(255,220,232,.12); --glass-shadow:rgba(0,0,0,.45);
  --hair:rgba(255,220,232,.11);
  --good:#86c99c; --warn:#e8b462; --bad:#f08f9b;
  --texture:rgba(255,215,228,.075);
  --flores:var(--flores-escuro); --flores-op:.55; --ramo:var(--ramo-escuro);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#1b1418;
  --aura1:#4a2433; --aura2:#3f2c26; --aura3:#26372b; --aura4:#33264a;
  --ink:#f5e8ec; --ink-soft:#c9b1ba; --ink-faint:#8d7680;
  --accent:#e6a3b8; --accent-ink:#2a1119; --accent-soft:#4d2836;
  --leaf:#a2bf9c;
  --glass:rgba(40,24,32,.5); --glass-strong:rgba(58,34,46,.7);
  --glass-line:rgba(255,220,232,.12); --glass-shadow:rgba(0,0,0,.45);
  --hair:rgba(255,220,232,.11);
  --good:#86c99c; --warn:#e8b462; --bad:#f08f9b;
  --texture:rgba(255,215,228,.075);
  --flores:var(--flores-escuro); --flores-op:.55; --ramo:var(--ramo-escuro);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-weight:400;font-size:15.5px;line-height:1.6;letter-spacing:.005em;min-height:100vh;-webkit-font-smoothing:antialiased}
.aura{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.aura i{position:absolute;border-radius:50%;filter:blur(90px);opacity:.75;animation:float 30s ease-in-out infinite alternate}
.aura i:nth-child(1){width:52vmax;height:52vmax;left:-16vmax;top:-18vmax;background:var(--aura1)}
.aura i:nth-child(2){width:44vmax;height:44vmax;right:-14vmax;top:10vmax;background:var(--aura2);animation-duration:36s}
.aura i:nth-child(3){width:40vmax;height:40vmax;left:16vmax;bottom:-22vmax;background:var(--aura3);animation-duration:42s}
.aura i:nth-child(4){width:28vmax;height:28vmax;right:10vmax;bottom:4vmax;background:var(--aura4);animation-duration:26s}
.aura .texture{position:absolute;inset:0;background:var(--texture);-webkit-mask-size:280px 280px;mask-size:280px 280px;-webkit-mask-repeat:repeat;mask-repeat:repeat}
.aura .flores{position:absolute;inset:0;background-image:var(--flores);background-size:420px 420px;opacity:var(--flores-op)}
@keyframes float{to{transform:translate(3vmax,2vmax) scale(1.06)}}
@media (prefers-reduced-motion:reduce){.aura i{animation:none}*{transition:none!important}}

.wrap{position:relative;z-index:1;max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:34px 80px;display:flex;flex-direction:column;gap:22px}
.glass{background:var(--glass);border:1px solid var(--glass-line);border-radius:16px;box-shadow:inset 0 1px 0 var(--glass-line),0 28px 50px -34px var(--glass-shadow);backdrop-filter:blur(22px) saturate(140%);-webkit-backdrop-filter:blur(22px) saturate(140%)}

header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.brand .eyebrow{margin-bottom:2px}
.brand h1{font-family:var(--f-display);font-weight:500;font-style:normal;font-size:clamp(46px,8vw,66px);line-height:.95;margin:0;letter-spacing:-.01em}
.brand h1 em{font-style:normal;color:var(--ink)}
.brand p{margin:10px 0 0;color:var(--ink-soft);font-size:12px;letter-spacing:.16em;text-transform:uppercase}
.flor-t{display:inline-block;width:.3em;height:.3em;margin-left:.08em;vertical-align:baseline;position:relative;top:-.62em;background:var(--accent);-webkit-mask:var(--flor-mask) center/contain no-repeat;mask:var(--flor-mask) center/contain no-repeat}
.top-right{display:flex;flex-direction:column;align-items:flex-end;gap:10px}
@media (max-width:600px){.top-right{align-items:flex-start}}
.switch{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.switch select{width:auto;max-width:250px;font:500 13px var(--f-body);letter-spacing:.02em;padding:8px 14px;border:1px solid var(--glass-line);border-radius:999px;background:var(--glass-strong);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.sync{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint);display:flex;align-items:center;gap:7px}
.sync b{width:5px;height:5px;border-radius:50%;background:var(--ink-faint);display:inline-block}
.sync.ok b{background:var(--good)}
.orn{display:flex;align-items:center;gap:14px;margin-block:-4px}
.orn::before,.orn::after{content:"";flex:1;height:1px;background:var(--hair)}
.orn span{width:13px;height:13px;background:var(--accent);opacity:.8;-webkit-mask:var(--flor-mask) center/contain no-repeat;mask:var(--flor-mask) center/contain no-repeat}

nav.tabs{position:sticky;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:5;display:flex;gap:2px;padding:5px;border-radius:999px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{flex:1 0 auto;border:0;background:transparent;color:var(--ink-soft);font:500 11.5px var(--f-body);letter-spacing:.14em;text-transform:uppercase;padding:11px 18px;border-radius:999px;cursor:pointer;white-space:nowrap;transition:background .25s,color .25s}
nav.tabs button:hover{color:var(--ink)}
nav.tabs button[aria-selected="true"]{background:var(--glass-strong);color:var(--accent);box-shadow:inset 0 1px 0 var(--glass-line),0 6px 16px -10px var(--glass-shadow)}
nav.tabs button[aria-selected="true"]::before{content:"";display:inline-block;width:9px;height:9px;margin-right:7px;vertical-align:0;background:var(--accent);-webkit-mask:var(--flor-mask) center/contain no-repeat;mask:var(--flor-mask) center/contain no-repeat}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}

section.view{display:flex;flex-direction:column;gap:22px}
.grid{display:grid;gap:22px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-3-2{grid-template-columns:minmax(0,3fr) minmax(0,2fr)}
@media (max-width:860px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g2,.g-3-2{grid-template-columns:minmax(0,1fr)}}
.card{padding:26px 28px;min-width:0}
@media (max-width:600px){.card{padding:22px 20px}}
.card h2{font-family:var(--f-display);font-weight:600;font-size:27px;line-height:1.1;margin:0 0 6px;text-wrap:balance}
.card .sub{color:var(--ink-soft);font-size:13.5px;font-weight:300;margin:0 0 20px;max-width:70ch}
.eyebrow{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-soft);font-weight:500}
.stat{padding:22px 24px}
.stat .num{font-family:var(--f-display);font-weight:500;font-size:52px;line-height:1;font-variant-numeric:lining-nums tabular-nums;margin-top:12px}
.stat .num small{font-family:var(--f-body);font-weight:300;font-size:13px;color:var(--ink-soft);margin-left:4px;letter-spacing:.02em}
.stat .hint{font-size:12.5px;font-weight:300;color:var(--ink-soft);margin-top:8px}
.meter{height:2px;background:var(--hair);overflow:visible;margin-top:16px;position:relative}
.meter i{display:block;height:100%;background:var(--accent);position:relative}
.meter i::after{content:"";position:absolute;right:-3px;top:-2px;width:6px;height:6px;border-radius:50%;background:inherit}

.hero-c{padding:34px 36px;display:flex;justify-content:space-between;align-items:center;gap:22px;flex-wrap:wrap;position:relative;overflow:hidden}
@media (max-width:600px){.hero-c{padding:26px 22px}}
.hero-c h2{font-family:var(--f-display);font-weight:400;font-size:clamp(30px,4.4vw,44px);margin:8px 0 0;line-height:1.05;text-wrap:balance}
.hero-c h2 em{color:var(--accent);font-style:italic}
.hero-c p.muted{font-weight:300}
.countdown{text-align:right;padding-right:120px}
.countdown .d{font-family:var(--f-display);font-style:italic;font-weight:500;font-size:84px;line-height:.85;color:var(--accent)}
.countdown .l{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);margin-top:8px;line-height:1.7}
@media (max-width:600px){.countdown{padding-right:0;text-align:left}}
.hero-c::before,.empty::before{content:"";position:absolute;right:-6px;bottom:-8px;width:170px;height:128px;background:var(--ramo) right bottom/contain no-repeat;pointer-events:none}
@media (max-width:600px){.hero-c::before{opacity:.4}}
.hero-c>*,.empty>*{position:relative}
.empty{position:relative;overflow:hidden}
.empty::before{right:auto;left:-6px;transform:scaleX(-1)}

.btn{border:1px solid var(--hair);background:var(--glass-strong);color:var(--ink);font:500 11.5px var(--f-body);letter-spacing:.14em;text-transform:uppercase;padding:12px 22px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:background .25s,color .25s,border-color .25s}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.primary:hover{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.sm{padding:7px 14px;font-size:10.5px}
.btn.danger{color:var(--bad)}
.btn.danger:hover{border-color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:1.5px solid var(--accent);outline-offset:3px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}

label.f{display:flex;flex-direction:column;gap:6px;font-size:10.5px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft);min-width:0}
input,select,textarea{font:400 15px var(--f-body);letter-spacing:normal;text-transform:none;color:var(--ink);background:transparent;border:0;border-bottom:1px solid var(--ink-faint);border-radius:0;padding:8px 2px;width:100%;min-width:0;transition:border-color .2s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
input::placeholder,textarea::placeholder{color:var(--ink-faint);font-weight:300}
select option{background:var(--bg);color:var(--ink)}
textarea{resize:vertical;min-height:84px;border:1px solid var(--hair);border-radius:12px;padding:10px 12px;background:var(--glass)}
.fgrid{display:grid;gap:22px 24px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}

.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:14px;padding:14px 2px;border-bottom:1px solid var(--hair);min-width:0}
.li:last-child{border-bottom:0}
.dot{width:13px;height:13px;flex:none;-webkit-mask:var(--flor-mask) center/contain no-repeat;mask:var(--flor-mask) center/contain no-repeat}
.li .t{flex:1;min-width:0}
.li .t b{font-weight:500;display:block;overflow-wrap:anywhere}
.li .t span{font-size:12.5px;font-weight:300;color:var(--ink-soft)}
.li .meter{margin-top:10px}
.pill{font-size:10px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;padding:4px 10px;border-radius:99px;border:1px solid var(--hair);color:var(--ink-soft);white-space:nowrap}
.pill.hot{border-color:var(--accent);color:var(--accent)}
.pill.good{color:var(--good)}
.pill.warn{color:var(--warn)}
.pill.bad{color:var(--bad)}

.chart{width:100%;overflow-x:auto}
.chart svg{display:block;width:100%;min-width:420px;height:auto;font-family:var(--f-body)}

.disc{padding:24px 28px}
@media (max-width:600px){.disc{padding:20px}}
.disc-head{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.disc-head h3{margin:0;font-family:var(--f-display);font-weight:600;font-size:25px;line-height:1.1;flex:1;min-width:150px;overflow-wrap:anywhere}
.disc-head select{width:auto;font-size:13px;padding:4px 2px}
.disc-meta{display:flex;gap:22px;flex-wrap:wrap;font-size:12.5px;font-weight:300;color:var(--ink-soft);margin-top:12px}
.disc-meta b{color:var(--ink);font-weight:500;font-variant-numeric:tabular-nums}
.stars{display:inline-flex;gap:3px}
.stars button{border:0;background:none;padding:0 1px;font-size:15px;cursor:pointer;color:var(--ink-faint);opacity:.45;line-height:1}
.stars button.on{color:var(--accent);opacity:1}
.topics{margin-top:12px;display:flex;flex-direction:column}
.topic{display:flex;align-items:center;gap:12px;padding:8px 2px;font-size:14.5px;border-bottom:1px solid var(--hair)}
.topic:last-child{border-bottom:0}
.topic input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent);flex:none;padding:0;border:0}
.topic .tn{flex:1;min-width:0;overflow-wrap:anywhere}
.topic.done .tn{color:var(--ink-faint);text-decoration:line-through;text-decoration-color:var(--ink-faint)}
.topic .x{border:0;background:none;color:var(--ink-faint);cursor:pointer;font-size:17px;padding:2px 6px;border-radius:6px}
.topic .x:hover{color:var(--bad)}
details.more summary{cursor:pointer;color:var(--ink-soft);font-size:10.5px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;margin-top:16px;list-style:none}
details.more summary::-webkit-details-marker{display:none}

.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:12px}
@media (max-width:860px){.week{grid-template-columns:minmax(0,1fr)}}
.day{padding:16px;min-width:0}
.day h4{margin:0 0 10px;font-family:var(--f-display);font-weight:600;font-size:20px;color:var(--ink);display:flex;justify-content:space-between;align-items:baseline}
.day h4 span:last-child{font-family:var(--f-body);font-size:10.5px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft)}
.day.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.block{border-radius:10px;padding:9px 11px;margin-top:7px;background:var(--glass-strong);border-left:2px solid var(--c);font-size:13px}
.block b{display:block;font-weight:500;overflow-wrap:anywhere}
.block span{color:var(--ink-soft);font-size:11.5px;font-weight:300}
.daypick{display:flex;gap:6px;flex-wrap:wrap}
.daypick label{display:flex;align-items:center;gap:6px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;padding:7px 12px;border-radius:999px;border:1px solid var(--hair);cursor:pointer}
.daypick input{width:auto;accent-color:var(--accent)}

.ai-out{white-space:normal;font-size:15px;line-height:1.75;font-weight:300;min-height:60px;max-width:72ch}
.ai-out p{margin:0 0 12px}
.ai-out ul{margin:0 0 12px;padding-left:20px}
.ai-out strong{color:var(--accent);font-weight:500}
.muted{color:var(--ink-soft)}
.empty{text-align:center;padding:52px 24px}
.empty h2{font-family:var(--f-display);font-weight:400;font-style:italic;font-size:clamp(34px,5vw,46px);margin:10px 0 10px;line-height:1.05}
.empty p{color:var(--ink-soft);font-weight:300;max-width:56ch;margin:0 auto 26px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(16px);opacity:0;padding:12px 22px;border-radius:999px;font-size:11.5px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;z-index:20;transition:all .3s;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font:500 11px var(--f-body);letter-spacing:.12em;text-transform:uppercase;padding:9px 15px;border-radius:999px;border:1px solid var(--hair);background:var(--glass-strong);cursor:pointer;color:var(--ink);transition:border-color .2s,color .2s}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip:disabled{opacity:.45;cursor:not-allowed}
.tnum{font-variant-numeric:tabular-nums}
.cal{flex:none;width:48px;text-align:center;border:1px solid var(--hair);border-radius:10px;padding:5px 0 4px;line-height:1.05;background:var(--glass)}
.cal b{display:block;font-family:var(--f-display);font-size:23px;font-weight:600}
.cal i{display:block;font-style:normal;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft)}
.li.past{opacity:.5}
.bul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:8px;font-size:14.5px;font-weight:300}
.bul li::marker{color:var(--accent)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:16px 24px;margin-bottom:18px}
.kv div span{display:block;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft);font-weight:500}
.kv div b{font-weight:500;overflow-wrap:anywhere}
.note{font-size:13px;font-weight:300;color:var(--ink-soft);border-left:2px solid var(--accent);padding:4px 0 4px 12px;margin:0 0 18px}
</style>

<div class="aura" aria-hidden="true"><i></i><i></i><i></i><i></i><div class="texture" id="texture"></div><div class="flores"></div></div>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="eyebrow">Caderno de estudos</div>
      <h1><em>Amélie</em><span class="flor-t" aria-hidden="true"></span></h1>
      <p id="subtitle">Organize, estude, revise.</p>
    </div>
    <div class="top-right">
      <div class="switch" id="switch"></div>
      <div class="sync" id="sync"><b></b><span>Carregando…</span></div>
    </div>

(function flores(){
  const enc = svg => `url("data:image/svg+xml,${encodeURIComponent(svg)}")`;
  const f = n => +n.toFixed(1);

  const daisy = (x,y,r,c,m) => { let p = ""; for (let k = 0; k < 12; k++) p += `<ellipse cx='${x}' cy='${f(y-r*.55)}' rx='${f(r*.16)}' ry='${f(r*.45)}' fill='${c}' transform='rotate(${k*30} ${x} ${y})'/>`; return p + `<circle cx='${x}' cy='${y}' r='${f(r*.24)}' fill='${m}'/>`; };
  const sprig = (x,y,len,ang,leaf,bud) => {

    let g = `<path d='M${x} ${y}Q${mx} ${my} ${ex} ${ey}' stroke='${leaf}' stroke-width='1.6' fill='none' stroke-linecap='round'/>`;

  // traço fino: pétalas contornadas com um véu de cor, folhas com nervura, miolo pontilhado

    for (let k = 0; k < 5; k++) { const a = (k*72+rot+36)*Math.PI/180; p += `<circle cx='${f(x+Math.sin(a)*r*.17)}' cy='${f(y-Math.cos(a)*r*.17)}' r='.9' fill='${m}'/>`; }
    return p + `<circle cx='${x}' cy='${y}' r='${f(r*.1)}' fill='${m}'/>`; };
  const dz = (x,y,r,c,m) => { let p = ""; for (let k = 0; k < 14; k++) p += `<ellipse cx='${x}' cy='${f(y-r*.56)}' rx='${f(r*.12)}' ry='${f(r*.42)}' fill='none' stroke='${c}' stroke-width='${W}' transform='rotate(${f(k*360/14)} ${x} ${y})'/>`; return p + `<circle cx='${x}' cy='${y}' r='${f(r*.2)}' fill='none' stroke='${m}' stroke-width='${W}'/><circle cx='${x}' cy='${y}' r='${f(r*.07)}' fill='${m}'/>`; };

      g += `<g transform='rotate(${rr} ${px} ${py}) translate(0 -7)'><ellipse cx='${px}' cy='${py}' rx='3.2' ry='7.4' fill='${leaf}' fill-opacity='.12' stroke='${leaf}' stroke-width='${W}'/><path d='M${px} ${f(py+6)}V${f(py-6)}' stroke='${leaf}' stroke-width='.6'/></g>`; });

  const CLARO = { rose:"#b0607b", leaf:"#86a882", mid:"#c4964a" };

/* ---------- estado: vários cadernos (concurso, faculdade, estudos gerais) ---------- */
const CORES_ANTIGAS = ["#c2457e","#7b4fa8","#e07a5f","#3a8f8a","#d4a017","#5b7fd6","#b5539c","#4f9a62","#d96f9b","#8a6bd1"];
function recolorir(c){ (c.disciplinas || []).forEach(d => { const i = CORES_ANTIGAS.indexOf(d.cor); if (i >= 0) d.cor = CORES[i]; }); return c; }
const VAZIO = () => ({ id:uid(), concurso:null, disciplinas:[], sessoes:[], dias:[1,2,3,4,5,6], minBloco:50 });
const RAIZ = () => { const c = VAZIO(); return { v:2, atual:c.id, cadernos:[c] }; };
function migrar(x){
  if (!x) return RAIZ();
  x = JSON.parse(JSON.stringify(x)); // cópia editável (snapshots do banco vêm congelados)
  if (x.v === 2 && Array.isArray(x.cadernos) && x.cadernos.length) {
    x.cadernos = x.cadernos.map(c => recolorir(Object.assign(VAZIO(), c)));
    if (!x.cadernos.some(c => c.id === x.atual)) x.atual = x.cadernos[0].id;
    return x;
  }
  const c = recolorir(Object.assign(VAZIO(), x)); delete c.v;
  return { v:2, atual:c.id, cadernos:[c] };
}
let R = RAIZ(), S = R.cadernos[0];
function usar(){ S = R.cadernos.find(c => c.id === R.atual) || R.cadernos[0]; R.atual = S.id; }
const nomeCaderno = c => c.concurso ? c.concurso.nome + (c.concurso.cargo ? " · " + c.concurso.cargo : "") : "Novo caderno";

try { const t = localStorage.getItem("cda.tab"); if (t) tab = t; } catch(e){}

/* ---------- persistência: nuvem (db) com fallback local ---------- */
let ref = null, writing = Promise.resolve(), saveTimer = null;
function setSync(ok, txt){ const el = $("#sync"); el.classList.toggle("ok", ok); el.querySelector("span").textContent = txt; }
function localLoad(){ try { const r = localStorage.getItem("cda.estado"); return r ? JSON.parse(r) : null; } catch(e){ return null; } }
function localSave(){ try { localStorage.setItem("cda.estado", JSON.stringify(R)); } catch(e){} }
function save(){
  localSave();
  if (!ref) return;
  clearTimeout(saveTimer);
  setSync(true, "Salvando…");
  saveTimer = setTimeout(() => {
    const body = JSON.parse(JSON.stringify(R));
    writing = writing.then(() => ref.set(body)).then(
      () => setSync(true, "Salvo na sua conta"),
      () => setSync(false, "Não salvou na nuvem; ficou neste navegador")
    );
  }, 700);
}
async function initStore(){
  const loc = localLoad();
  if (loc) { R = migrar(loc); usar(); }
  render();
  setSync(false, "Salvo neste navegador");
  setTimeout(alertaInicial, 600);
  if (!window.claude || !window.claude.use) return;
  try {
    const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
    if (!db || !user) return;
    const id = await user.id();
    if (!id) return;
    ref = db.collection("data/users/" + id).doc("estudos");
    const snap = await Promise.race([ref.get(), new Promise((_, rej) => setTimeout(() => rej("timeout"), 10000))]);
    if (snap.exists) { R = migrar(snap.data()); usar(); localSave(); render(); setSync(true, "Salvo na sua conta"); }
    else if (loc) { save(); }
    else setSync(true, "Conectado à sua conta");
  } catch(e) { ref = ref || null; setSync(false, "Salvo neste navegador"); }
  alertaInicial();
}

/* ---------- toast ---------- */

/* ---------- modelo INSS ---------- */
function modeloINSS(){
  const D = (nome, peso, topicos) => ({ id:uid(), nome, peso, questoes:0, dominio:2, cor:"", topicos: topicos.map(n => ({ id:uid(), nome:n, feito:false, dataFeito:null, rev:0 })) });
  const ds = [
    D("Direito Previdenciário", 3, ["Seguridade social: conceito, princípios e organização","Custeio da seguridade social","Segurados obrigatórios e facultativos","Filiação e inscrição","Salário de contribuição","Carência","Salário de benefício e RMI","Aposentadorias (regras da EC 103/2019)","Auxílio por incapacidade temporária e permanente","Pensão por morte e auxílio-reclusão","Salário-maternidade e salário-família","BPC/LOAS (Lei 8.742/93)","Decadência e prescrição","Acumulação de benefícios"]),
    D("Língua Portuguesa", 2, ["Interpretação de texto","Ortografia e acentuação","Classes de palavras","Concordância verbal e nominal","Regência e crase","Pontuação","Reescrita de frases"]),
    D("Direito Constitucional", 2, ["Princípios fundamentais","Direitos e garantias fundamentais","Direitos sociais","Organização do Estado","Administração Pública (art. 37 a 41)","Ordem social: seguridade (art. 194 a 204)"]),
    D("Direito Administrativo", 2, ["Princípios da Administração","Poderes administrativos","Atos administrativos","Organização administrativa","Licitações (Lei 14.133/2021)","Improbidade administrativa","Processo administrativo (Lei 9.784/99)"]),
    D("Lei 8.112/90", 2, ["Provimento e vacância","Direitos e vantagens","Regime disciplinar","Processo administrativo disciplinar"]),
    D("Ética no Serviço Público", 1, ["Decreto 1.171/94","Lei 12.813/2013 (conflito de interesses)"]),
    D("Raciocínio Lógico", 1, ["Proposições e conectivos","Equivalências e negações","Porcentagem e razão","Análise combinatória e probabilidade"]),
    D("Informática", 1, ["Windows e pastas","Editores de texto e planilhas","Internet e correio eletrônico","Segurança da informação"])
  ];
  ds.forEach((d, i) => d.cor = CORES[i % CORES.length]);
  return ds;
}

/* ---------- métricas ---------- */
const discById = id => S.disciplinas.find(d => d.id === id);
function pctTopicos(d){ return d.topicos.length ? d.topicos.filter(t => t.feito).length / d.topicos.length : 0; }
function ultimoEstudo(d){ let u = null; for (const s of S.sessoes) if (s.disc === d.id && (!u || s.data > u)) u = s.data; return u; }
function acertoDisc(d){ let q=0,a=0; for (const s of S.sessoes) if (s.disc === d.id){ q += +s.q||0; a += +s.a||0; } return q ? a/q : null; }
function minutosDisc(d){ return S.sessoes.reduce((t, s) => t + (s.disc === d.id ? +s.min||0 : 0), 0); }
function prioridade(d){
  const u = ultimoEstudo(d);
  const dias = u ? Math.min(diffDays(u, today()), 21) : 21;
  const ac = acertoDisc(d);
  let p = (+d.peso||1) * (6 - (+d.dominio||1)) * (1 + dias/7) * (1 - pctTopicos(d)*0.5);
  if (ac !== null && ac < .7) p *= 1.3;
  return p;
}
function porPrioridade(){ return [...S.disciplinas].sort((a,b) => prioridade(b) - prioridade(a)); }
function inicioSemana(){ const d = new Date(); d.setDate(d.getDate() - ((d.getDay()+6)%7)); return ymd(d); } // segunda
function minutosSemana(){ const ini = inicioSemana(); return S.sessoes.reduce((t,s) => t + (s.data >= ini ? +s.min||0 : 0), 0); }
function sequencia(){
  const dias = new Set(S.sessoes.map(s => s.data));
  let n = 0, d = today();
  if (!dias.has(d)) d = addDays(d, -1);
  while (dias.has(d)) { n++; d = addDays(d, -1); }
  return n;
}
function revisoesPendentes(){
  const hoje = today(), out = [];
  for (const d of S.disciplinas) for (const t of d.topicos) {
    if (!t.feito || !t.dataFeito || t.rev >= REV.length) continue;
    const quando = addDays(t.dataFeito, REV[t.rev]);
    if (quando <= hoje) out.push({ d, t, quando, atraso: diffDays(quando, hoje) });
  }
  return out.sort((a,b) => b.atraso - a.atraso);
}
function totais(){
  let q=0,a=0,min=0; for (const s of S.sessoes){ q+=+s.q||0; a+=+s.a||0; min+=+s.min||0; }
  let tt=0,tf=0; for (const d of S.disciplinas){ tt+=d.topicos.length; tf+=d.topicos.filter(t=>t.feito).length; }
  return { q, a, min, tt, tf, acerto: q ? a/q : null, edital: tt ? tf/tt : 0 };
}

/* ---------- cronograma ---------- */
function gerarCronograma(){
  const c = S.concurso; if (!c || !S.disciplinas.length) return null;
  const dias = (S.dias && S.dias.length) ? [...S.dias].sort() : [1,2,3,4,5];
  const bloco = +S.minBloco || 50;
  const totalBlocos = Math.max(dias.length, Math.round((+c.meta||15) * 60 / bloco));
  const ds = porPrioridade(); const pr = ds.map(prioridade); const soma = pr.reduce((a,b)=>a+b,0) || 1;
  // distribuição proporcional com maiores restos
  const cotas = ds.map((d,i) => ({ d, exata: pr[i]/soma*totalBlocos }));
  cotas.forEach(x => x.n = Math.floor(x.exata));
  let resto = totalBlocos - cotas.reduce((a,x)=>a+x.n,0);
  [...cotas].sort((a,b) => (b.exata-b.n) - (a.exata-a.n)).slice(0, resto).forEach(x => x.n++);
  // intercala: ciclo round-robin
  const fila = []; const restante = cotas.map(x => ({ d:x.d, n:x.n }));
  while (fila.length < totalBlocos){ let add = false; for (const r of restante) if (r.n > 0){ fila.push(r.d); r.n--; add = true; } if (!add) break; }
  const plano = {}; dias.forEach(d => plano[d] = []);
  fila.forEach((d, i) => plano[dias[i % dias.length]].push(d));
  return { plano, bloco, dias };
}

/* ---------- render ---------- */
function render(){
  document.querySelectorAll("nav.tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === tab));
  const c = S.concurso;
  $("#subtitle").textContent = c ? ((c.tipo ? c.tipo + " · " : "") + c.nome + (c.cargo ? " · " + c.cargo : "") + (c.banca ? " · " + c.banca : "")) : "Organize, estude, revise.";
  $("#switch").innerHTML = `<select id="sel-caderno" data-act="caderno" aria-label="Caderno">${R.cadernos.map(k => `<option value="${k.id}" ${k.id===S.id?"selected":""}>${esc(nomeCaderno(k))}</option>`).join("")}</select><button class="btn sm" data-act="novo-caderno">+ Novo caderno</button>`;
  const app = $("#app");
  if (!c && tab !== "concurso") { app.innerHTML = vEmpty(); return; }
  app.innerHTML = ({ painel:vPainel, disciplinas:vDisciplinas, estudar:vEstudar, cronograma:vCronograma, edital:vEdital, mentora:vMentora, concurso:vConcurso }[tab] || vPainel)();
  if (tab === "mentora") restoreAI();
}

function vEmpty(){

    <h2>O que você vai estudar neste caderno?</h2>
    <p>Pode ser um concurso, uma matéria ou semestre da faculdade, ou um estudo livre. Cadastre o objetivo e a data-alvo, adicione as disciplinas e os tópicos, registre cada sessão de estudo e o caderno calcula seu progresso, sugere o que estudar e avisa as revisões. Use "+ Novo caderno" no topo para separar cada objetivo.</p>
    <div class="row" style="justify-content:center">

function rel(s){ const n = diffDays(s, today()); return n === 0 ? "hoje" : n === 1 ? "ontem" : "há " + n + " dias"; }
function motivo(d){
  const r = [], u = ultimoEstudo(d), ac = acertoDisc(d);
  if (+d.peso >= 3) r.push("tem peso alto na prova");
  if (+d.dominio <= 2) r.push("você marcou domínio baixo");
  if (!u) r.push("ainda não foi estudada"); else if (diffDays(u, today()) >= 4) r.push("está há " + diffDays(u, today()) + " dias parada");
  if (ac !== null && ac < .7) r.push("o acerto está em " + Math.round(ac*100) + "%");
  if (!r.length) r.push("é a que mais rende agora pelo equilíbrio entre peso e progresso");
  return "Porque " + r.join(", ").replace(/, ([^,]*)$/, " e $1") + ".";
}
function chart14(){
  const dias = []; for (let i = 13; i >= 0; i--) dias.push(addDays(today(), -i));
  const v = dias.map(d => S.sessoes.reduce((t,s) => t + (s.data === d ? +s.min||0 : 0), 0));
  const metaDia = S.concurso && S.concurso.meta ? (+S.concurso.meta*60) / ((S.dias||[]).length || 7) : 0;
  const maxV = Math.max(60, ...v, metaDia);
  const top = Math.ceil(maxV / 60) * 60;
  const W = 640, H = 220, L = 38, R = 8, T = 12, B = 30, cw = (W-L-R)/14, h = H-T-B;
  const y = m => T + h - m/top*h;
  let g = "";
  const step = top <= 240 ? 60 : 120;
  for (let m = 0; m <= top; m += step) g += `<line x1="${L}" x2="${W-R}" y1="${y(m)}" y2="${y(m)}" stroke="var(--hair)"/><text x="${L-6}" y="${y(m)+4}" text-anchor="end" font-size="11" fill="var(--ink-soft)">${m/60}h</text>`;
  if (metaDia) g += `<line x1="${L}" x2="${W-R}" y1="${y(metaDia)}" y2="${y(metaDia)}" stroke="var(--accent)" stroke-dasharray="4 4" opacity=".7"/><text x="${W-R}" y="${y(metaDia)-5}" text-anchor="end" font-size="11" fill="var(--accent)">meta/dia</text>`;
  v.forEach((m, i) => {
    const x = L + i*cw + cw*0.32, w = cw*0.36, isT = i === 13;
    if (m > 0) g += `<rect x="${x}" y="${y(m)}" width="${w}" height="${T+h-y(m)}" rx="3" fill="${isT ? "var(--accent)" : "var(--leaf)"}" opacity="${isT?1:.7}"><title>${fmtDate(dias[i])}: ${fmtH(m)}</title></rect>`;
    const dd = parse(dias[i]);
    g += `<text x="${x+w/2}" y="${H-12}" text-anchor="middle" font-size="10.5" fill="${isT?"var(--accent)":"var(--ink-soft)"}">${DIAS[dd.getDay()].slice(0,1)}${dd.getDate()}</text>`;
  });
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Horas estudadas por dia nos últimos 14 dias">${g}</svg></div>`;
}

function md(t){
  const lines = esc(t).split(/\n/); let out = "", ul = false;
  for (let l of lines){
    l = l.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/^#{1,4}\s*(.+)$/, "<strong>$1</strong>");
    if (/^\s*[-*•]\s+/.test(l)){ if (!ul){ out += "<ul>"; ul = true; } out += "<li>" + l.replace(/^\s*[-*•]\s+/, "") + "</li>"; }
    else { if (ul){ out += "</ul>"; ul = false; } if (l.trim()) out += "<p>" + l + "</p>"; }
  }
  return out + (ul ? "</ul>" : "");
}

${resumo()}

PEDIDO: ${pedido}`;

function extrairLocal(t){
  const linhas = t.split(/\n+/).flatMap(l => l.split(/(?<=[.;])\s+(?=[A-ZÁÉÍÓÚÂÊÔÃÕÇ0-9])/)).map(x => x.replace(/\s+/g, " ").trim()).filter(Boolean);
  const datas = [], valores = [], exig = [], vistos = new Set();
  const reD = /(\d{1,2})\/(\d{1,2})\/(\d{2,4})|(\d{1,2})º? de (janeiro|fevereiro|março|marco|abril|maio|junho|julho|agosto|setembro|outubro|novembro|dezembro) de (\d{4})/gi;
  const curto = (l, n) => l.length > n ? l.slice(0, n-1) + "…" : l;
  for (const l of linhas) {
    let m; reD.lastIndex = 0;
    while ((m = reD.exec(l))) {
      let d, mo, y;
      if (m[1]) { d = +m[1]; mo = +m[2]; y = +m[3]; if (y < 100) y += 2000; } else { d = +m[4]; mo = MESES[m[5].toLowerCase()]; y = +m[6]; }
      if (!mo || mo > 12 || d < 1 || d > 31 || y < 2000 || y > 2100) continue;
      const iso = y + "-" + pad(mo) + "-" + pad(d), ev = curto(l, 180);
      if (!vistos.has(iso + ev)) { vistos.add(iso + ev); datas.push({ evento:ev, data:iso, fim:null, obs:"" }); }
    }
    if (vistos.has("L" + l)) continue; vistos.add("L" + l);
    if (/R\$\s?\d/.test(l)) valores.push({ descricao:curto(l, 200), valor:(l.match(/R\$\s?[\d.]+(,\d{2})?/) || [""])[0] });
    if (/(requisit|escolaridade|document|eliminad|vedad|proibid|caneta|identifica[çc][ãa]o|apresentar)/i.test(l) && l.length > 30 && l.length < 300) exig.push(l);
  }
  datas.sort((a, b) => a.data.localeCompare(b.data));
  return { orgao:"", banca:"", resumo:"", cargos:[], valores:valores.slice(0, 30), datas:datas.slice(0, 60), prova:null, exigencias:exig.slice(0, 25), alertas:[], disciplinas:[] };
}

function normalizar(o){
  o = o && typeof o === "object" ? o : {};
  const arr = x => Array.isArray(x) ? x : [], str = x => (x == null || x === "null") ? "" : String(x);
  return {
    orgao:str(o.orgao), banca:str(o.banca), resumo:str(o.resumo),
    cargos: arr(o.cargos).filter(c => c && c.nome).slice(0, 20).map(c => ({ nome:str(c.nome), vagas:str(c.vagas), remuneracao:str(c.remuneracao), escolaridade:str(c.escolaridade), requisitos:str(c.requisitos) })),
    valores: arr(o.valores).filter(v => v && (v.descricao || v.valor)).slice(0, 30).map(v => ({ descricao:str(v.descricao), valor:str(v.valor) })),
    datas: arr(o.datas).filter(d => d && isoOk(d.data)).map(d => ({ evento:str(d.evento), data:d.data, fim:isoOk(d.fim), obs:str(d.obs) })).sort((a, b) => a.data.localeCompare(b.data)).slice(0, 60),
    prova: o.prova && typeof o.prova === "object" ? { data:isoOk(o.prova.data), horario:str(o.prova.horario), duracao:str(o.prova.duracao), formato:str(o.prova.formato) } : null,
    exigencias: arr(o.exigencias).map(str).filter(Boolean).slice(0, 40),
    alertas: arr(o.alertas).map(str).filter(Boolean).slice(0, 10),
    disciplinas: []
  };
}
function normDisc(list){
  return (Array.isArray(list) ? list : []).filter(d => d && d.nome).slice(0, 25).map(d => ({
    nome:String(d.nome).slice(0, 120), questoes:Number.isFinite(+d.questoes) && +d.questoes > 0 ? +d.questoes : null, peso:Number.isFinite(+d.peso) && +d.peso > 0 ? +d.peso : null,
    topicos:(Array.isArray(d.topicos) ? d.topicos : []).filter(t => typeof t === "string" && t.trim()).slice(0, 40).map(t => t.trim().slice(0, 140))
  }));
}
const P_INFO = cargo => `Você vai ler um edital de concurso público brasileiro e extrair as informações para uma candidata. Responda SOMENTE com um JSON neste formato:

async function carregarPdfJs(){
  if (window.pdfjsLib) return;
  await new Promise((ok, no) => { const sc = document.createElement("script"); sc.src = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"; sc.onload = ok; sc.onerror = no; document.head.appendChild(sc); });
  window.pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
}
async function carregarArquivoEdital(file){
  edMsg = "Abrindo " + file.name + "…"; updMsg();
  try {
    let texto = "";
    if (/\.txt$/i.test(file.name) || file.type === "text/plain") texto = await file.text();
    else {
      await carregarPdfJs();
      const pdf = await window.pdfjsLib.getDocument({ data:new Uint8Array(await file.arrayBuffer()) }).promise;
      for (let i = 1; i <= pdf.numPages; i++) {
        const c = await (await pdf.getPage(i)).getTextContent(); let y = null;
        for (const it of c.items) { const ny = it.transform ? it.transform[5] : y; texto += (y !== null && Math.abs(ny - y) > 2) ? "\n" : " "; texto += it.str; y = ny; }
        texto += "\n\n";
        if (i % 5 === 0) { edMsg = `Lendo o PDF: página ${i} de ${pdf.numPages}`; updMsg(); }
      }
    }
    if (texto.trim().length < 200) throw new Error("vazio");
    edSalvarTexto(texto); edMsg = "Texto carregado. Agora toque em Analisar edital."; render();
  } catch(e) {
    edMsg = "Não consegui ler esse arquivo. Abra o PDF, selecione tudo (Ctrl+A), copie e cole o texto aqui."; updMsg();
  }
}

async function analisarEdital(){
  if (edBusy) return;
  const raw = (($("#ed-txt") || {}).value || "").trim();
  if (raw.length < 200) { edMsg = "O texto está muito curto. Cole o edital completo."; updMsg(); return; }
  edSalvarTexto(raw);
  const t = raw.replace(/[ \t ]+/g, " ").replace(/\n\s*\n\s*\n+/g, "\n\n");
  edBusy = true; edMsg = "Lendo o edital…"; render();
  if (sampleFn === undefined) sampleFn = (window.claude && window.claude.use) ? await claude.use("sample") : null;
  let dados = null, fonte = "local", aviso = "";
  if (sampleFn) {
    const cargo = (S.concurso && S.concurso.cargo) || "", MAX = 150000;
    let tInfo = t, tDisc = t;
    if (t.length > MAX) {
      const kw = /(\d{1,2}\/\d{1,2}\/\d{2,4}|R\$|inscri|isen|taxa|vaga|requisit|remunera|subs[ií]dio|escolar|cronograma|document|eliminad|recurso|resultado|port[õo]es|hor[áa]rio|caneta|identifica|prova|cargo|banca)/i;
      tInfo = (t.slice(0, 20000) + "\n…\n" + t.slice(20000).split("\n").filter(l => kw.test(l)).join("\n")).slice(0, MAX);
      const ini = t.search(/conte[uú]do program[aá]tico/i); tDisc = (ini >= 0 ? t.slice(ini) : t.slice(-MAX)).slice(0, MAX);
    }
    try {
      edMsg = "Lendo datas, valores e exigências…"; updMsg();
      dados = normalizar(await sampleFn.json(P_INFO(cargo) + tInfo, { cache:false })); fonte = "ia";
      edMsg = "Lendo as disciplinas e o conteúdo…"; updMsg();
      try { dados.disciplinas = normDisc(((await sampleFn.json(P_DISC(cargo) + tDisc, { cache:false })) || {}).disciplinas); }
      catch(e) { aviso = "Não consegui ler o conteúdo programático desta vez. Toque em Analisar edital de novo para tentar."; }
    } catch(e) {
      if (e && e.code === "not_granted") sampleFn = null;
      dados = null; aviso = "A IA não respondeu agora, então fiz uma leitura simples. Tente de novo em instantes para a leitura completa.";

}

function importarDisciplinas(){
  const ds = (S.edital && S.edital.dados.disciplinas) || []; let novas = 0, tops = 0;
  const norm = x => String(x).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9 ]/g, "").replace(/\s+/g, " ").trim();
  const maxQ = Math.max(1, ...ds.map(d => d.questoes || 0));
  for (const e of ds) {
    const peso = e.questoes ? Math.max(1, Math.min(3, Math.ceil(e.questoes / maxQ * 3))) : e.peso ? Math.max(1, Math.min(3, Math.round(e.peso))) : 2;
    let d = S.disciplinas.find(x => norm(x.nome) === norm(e.nome));
    if (!d) { d = { id:uid(), nome:e.nome, peso, questoes:e.questoes || 0, dominio:2, cor:CORES[S.disciplinas.length % CORES.length], topicos:[] }; S.disciplinas.push(d); novas++; }
    else if (e.questoes) d.questoes = e.questoes;
    for (const t of e.topicos) if (!d.topicos.some(x => norm(x.nome) === norm(t))) { d.topicos.push({ id:uid(), nome:t, feito:false, dataFeito:null, rev:0 }); tops++; }
  }
  save(); render();
  toast(novas || tops ? `${novas} ${novas === 1 ? "disciplina nova" : "disciplinas novas"} e ${tops} ${tops === 1 ? "tópico" : "tópicos"} importados` : "Suas disciplinas já estavam iguais ao edital", 3200);
}

function avisosEdital(){
  const ds = (S.edital && S.edital.dados.datas) || [], h = today(), out = [];
  for (const d of ds) {
    if (d.fim && d.data <= h && d.fim >= h) out.push(Object.assign({}, d, { quando:d.fim, estado:"agora", dias:diffDays(h, d.fim) }));
    else if (d.data >= h) out.push(Object.assign({}, d, { quando:d.data, estado:"futuro", dias:diffDays(h, d.data) }));
  }
  return out.sort((a, b) => a.quando.localeCompare(b.quando));
}
function statusData(d){
  const h = today();
  if (d.fim && d.data <= h && d.fim >= h) { const n = diffDays(h, d.fim); return [n === 0 ? "termina hoje" : "aberto · termina em " + n + (n > 1 ? " dias" : " dia"), n <= 3 ? "bad" : "hot"]; }
  if ((d.fim || d.data) < h) return ["encerrado", ""];
  const n = diffDays(h, d.data); return [n === 0 ? "hoje" : n === 1 ? "amanhã" : "em " + n + " dias", n <= 3 ? "bad" : n <= 10 ? "warn" : ""];
}

  ${dd.exigencias.length ? `<div class="glass card"><h2>Exigências da banca</h2><p class="sub">Requisitos, documentos, regras do dia da prova e critérios de eliminação</p>${lista(dd.exigencias)}</div>` : ""}
  ${dd.disciplinas.length ? `<div class="glass card"><div class="row"><h2 style="margin:0">Conteúdo da prova</h2><span class="spacer"></span><button class="btn sm primary" data-act="ed-importar">Importar para minhas disciplinas</button></div>
    <p class="sub" style="margin-top:6px">A importação cria as disciplinas que faltam e acrescenta os tópicos novos, sem apagar nada do que você já marcou.</p>
    <div class="list">${dd.disciplinas.map(d => `<div class="li"><div class="t"><b>${esc(d.nome)}</b><span>${[d.questoes && d.questoes + " questões", d.peso && "peso " + d.peso, d.topicos.length + (d.topicos.length === 1 ? " tópico" : " tópicos")].filter(Boolean).join(" · ")}</span></div></div>`).join("")}</div></div>` : ""}`;
}

function vConcurso(){
  const c = S.concurso || {};
  return `<section class="view">
  <div class="glass card"><h2>${S.concurso ? "Objetivo deste caderno" : "Cadastrar objetivo"}</h2><p class="sub">Esses dados definem a contagem regressiva, a meta da semana e o cronograma.</p>
    <form id="f-conc" class="fgrid">
      <label class="f">Tipo<select id="c-tipo">${["Concurso público","Faculdade","Estudos gerais","Certificação","Idioma"].map(t => `<option ${(c.tipo||"Concurso público")===t?"selected":""}>${t}</option>`).join("")}</select></label>
      <label class="f">Nome<input id="c-nome" required value="${esc(c.nome||"")}" placeholder="Ex.: INSS, Contabilidade, Cálculo I"></label>
      <label class="f">Detalhe<input id="c-cargo" value="${esc(c.cargo||"")}" placeholder="Ex.: cargo, curso ou semestre"></label>
      <label class="f">Banca ou instituição<input id="c-banca" value="${esc(c.banca||"")}" placeholder="Ex.: Cebraspe, sua faculdade"></label>
      <label class="f">Data-alvo<input id="c-data" type="date" value="${esc(c.data||"")}"></label>
      <label class="f">O que acontece nessa data<input id="c-marco" value="${esc(c.marco||"")}" placeholder="a prova, a P2, a entrega do TCC"></label>
      <label class="f">Meta semanal (horas)<input id="c-hmeta" type="number" min="1" max="80" value="${esc(c.meta||15)}"></label>
      <div class="row" style="align-self:end"><button class="btn primary" type="submit">Salvar</button></div>
    </form>
  </div>
  ${!S.concurso ? `<div class="glass card"><h2>Já usa a Amélie?</h2><p class="sub">Traga seus cadernos de outro navegador ou computador.</p><div class="row"><label class="btn" for="f-import" style="cursor:pointer">Restaurar backup</label><input type="file" id="f-import" accept="application/json,.json" hidden></div></div>` : ""}
  ${S.concurso ? `<div class="glass card"><h2>Dados</h2><p class="sub">${window.claude ? "Tudo fica salvo na sua conta Claude." : "Seus dados ficam salvos neste navegador. Baixe um backup de vez em quando para não perder nada se limpar o navegador ou trocar de computador."}</p>
    <div class="row">
      ${S.disciplinas.length ? "" : `<button class="btn" data-act="modelo-inss">Carregar disciplinas do modelo INSS</button>`}
      ${window.claude ? "" : `<button class="btn" data-act="exportar">Baixar backup</button>`}
      <label class="btn" for="f-import" style="cursor:pointer">Restaurar backup</label><input type="file" id="f-import" accept="application/json,.json" hidden>
      <button class="btn ghost danger" data-act="reset">${R.cadernos.length > 1 ? "Excluir este caderno" : "Apagar tudo e recomeçar"}</button>
    </div></div>` : ""}
  </section>`;
}

/* ---------- eventos ---------- */
const armed = new Map(); // confirmação em dois cliques
function confirmTwice(btn, key, label, fn){
  if (armed.get(key)) { armed.delete(key); fn(); return; }
  armed.set(key, true); const old = btn.textContent; btn.textContent = label;
  setTimeout(() => { if (armed.get(key)) { armed.delete(key); if (btn.isConnected) btn.textContent = old; } }, 3500);
}

document.querySelector("nav.tabs").addEventListener("click", e => {
  const b = e.target.closest("button[data-tab]"); if (!b) return; go(b.dataset.tab);
});
function go(t){ tab = t; try { localStorage.setItem("cda.tab", t); } catch(e){} render(); window.scrollTo({top:0,behavior:"smooth"}); }

document.addEventListener("click", e => {
  const be = e.target.closest("[data-act^='ed-']");
  if (be) {
    const a = be.dataset.act;
    if (a === "ed-analisar") analisarEdital();
    else if (a === "ed-importar") importarDisciplinas();
    else if (a === "ed-usar-data") { const pv = S.edital.dados.prova; S.concurso.data = pv.data; S.concurso.marco = S.concurso.marco || "a prova"; if (!S.concurso.banca && S.edital.dados.banca) S.concurso.banca = S.edital.dados.banca; save(); render(); toast("Data da prova atualizada no seu objetivo"); }
    else if (a === "ed-apagar") confirmTwice(be, "ed-apagar", "Confirmar", () => { S.edital = null; save(); render(); toast("Análise apagada"); });
    return;
  }
  const b = e.target.closest("[data-act]"); if (!b || b.tagName === "INPUT" || b.tagName === "SELECT") return;
  const a = b.dataset.act;
  if (a === "goto") go(b.dataset.to);
  else if (a === "goto-rev") { go("painel"); setTimeout(() => { const r = $("#revisoes"); if (r) r.scrollIntoView({behavior:"smooth"}); }, 60); }
  else if (a === "modelo-inss") {
    if (!S.concurso) S.concurso = { tipo:"Concurso público", nome:"INSS", cargo:"Técnico do Seguro Social", banca:"", data:"", marco:"a prova", meta:15 };
    if (!S.disciplinas.length) S.disciplinas = modeloINSS();
    save(); toast("Modelo INSS carregado. Ajuste a data da prova em Meu concurso."); go("painel");
  }
  else if (a === "estudar-disc") { estudoPre = b.dataset.id; go("estudar"); }
  else if (a === "revisei") {
    const d = discById(b.dataset.d), t = d && d.topicos.find(x => x.id === b.dataset.t);
    if (t) { t.rev = (t.rev||0) + 1; t.dataRev = today(); save(); render(); toast(t.rev >= REV.length ? "Ciclo de revisões concluído" : "Próxima revisão em " + (REV[t.rev] - REV[t.rev-1]) + " dias"); }
  }
  else if (a === "dom") { const d = discById(b.dataset.id); d.dominio = +b.dataset.n; save(); render(); }
  else if (a === "del-top") { const d = discById(b.dataset.d); d.topicos = d.topicos.filter(t => t.id !== b.dataset.t); save(); render(); }
  else if (a === "del-disc") confirmTwice(b, "d"+b.dataset.id, "Confirmar exclusão", () => { S.disciplinas = S.disciplinas.filter(d => d.id !== b.dataset.id); save(); render(); toast("Disciplina excluída"); });
  else if (a === "del-sess") confirmTwice(b, "s"+b.dataset.id, "Confirmar", () => { S.sessoes = S.sessoes.filter(s => s.id !== b.dataset.id); save(); render(); toast("Sessão excluída"); });
  else if (a === "reset") confirmTwice(b, "reset", "Clique de novo para confirmar", () => {
    if (R.cadernos.length > 1) { R.cadernos = R.cadernos.filter(k => k.id !== S.id); R.atual = R.cadernos[0].id; toast("Caderno excluído"); }
    else { R = RAIZ(); toast("Tudo apagado"); }
    usar(); save(); go("painel");
  });
  else if (a === "exportar") {
    const blob = new Blob([JSON.stringify(R, null, 2)], { type:"application/json" });
    const link = document.createElement("a"); link.href = URL.createObjectURL(blob); link.download = "amelie-backup-" + today() + ".json";
    document.body.appendChild(link); link.click(); link.remove(); setTimeout(() => URL.revokeObjectURL(link.href), 1000);
    toast("Backup baixado");
  }
  else if (a === "novo-caderno") { const k = VAZIO(); R.cadernos.push(k); R.atual = k.id; usar(); save(); go("concurso"); }
  else if (a === "ai") { const p = PROMPTS[b.dataset.p]; askAI(p[0], p[1]); }
});

document.addEventListener("input", e => {
  if (e.target.id === "ed-txt") { clearTimeout(edTimer); const v = e.target.value; edTimer = setTimeout(() => edSalvarTexto(v), 600); }
});
document.addEventListener("change", e => {
  const el = e.target;
  if (el.id === "ed-file" && el.files && el.files[0]) { carregarArquivoEdital(el.files[0]); return; }
  if (el.id === "f-import" && el.files && el.files[0]) {
    el.files[0].text().then(txt => {
      const d = JSON.parse(txt);
      if (!d || !(Array.isArray(d.cadernos) || Array.isArray(d.disciplinas))) throw new Error("formato");
      R = migrar(d); usar(); save(); go("painel"); toast("Backup restaurado");
    }).catch(() => toast("Esse arquivo não é um backup da Amélie"));
    return;
  }
  const a = el.dataset.act; if (!a) return;
  if (a === "caderno") { R.atual = el.value; usar(); estudoPre = null; AI.text = ""; AI.pergunta = ""; save(); render(); }
  else if (a === "topico") {
    const d = discById(el.dataset.d), t = d.topicos.find(x => x.id === el.dataset.t);
    t.feito = el.checked; t.dataFeito = el.checked ? today() : null; t.rev = 0;
    save(); render(); if (el.checked) toast("Primeira revisão agendada para amanhã");
  }
  else if (a === "peso") { discById(el.dataset.id).peso = +el.value; save(); render(); }
  else if (a === "dia") { const n = +el.dataset.n; S.dias = (S.dias||[]).filter(x => x !== n); if (el.checked) S.dias.push(n); save(); render(); }
  else if (a === "bloco") { S.minBloco = +el.value; save(); render(); }
  else if (a === "meta") { const v = +el.value; if (v > 0) { S.concurso.meta = v; save(); render(); } }
});

document.addEventListener("submit", e => {
  e.preventDefault();
  const f = e.target;
  if (f.id === "f-conc") {
    S.concurso = Object.assign(S.concurso || {}, { tipo:$("#c-tipo").value, marco:$("#c-marco").value.trim(), nome:$("#c-nome").value.trim(), cargo:$("#c-cargo").value.trim(), banca:$("#c-banca").value.trim(), data:$("#c-data").value, meta:+$("#c-hmeta").value || 15 });
    save(); toast("Objetivo salvo"); go(S.disciplinas.length ? "painel" : "disciplinas");
  }
  else if (f.id === "f-disc") {
    const nome = $("#d-nome").value.trim(); if (!nome) return;
    const tops = $("#d-top").value.split("\n").map(s => s.replace(/^[\s\-•\d.)]+/, "").trim()).filter(Boolean);
    S.disciplinas.push({ id:uid(), nome, peso:+$("#d-peso").value, questoes:+$("#d-q").value||0, dominio:2, cor:CORES[S.disciplinas.length % CORES.length], topicos: tops.map(n => ({ id:uid(), nome:n, feito:false, dataFeito:null, rev:0 })) });
    save(); render(); toast("Disciplina adicionada");
  }
  else if (f.dataset.form === "add-top") {
    const d = discById(f.dataset.id), inp = $("#nt-" + d.id), n = inp.value.trim(); if (!n) return;
    d.topicos.push({ id:uid(), nome:n, feito:false, dataFeito:null, rev:0 }); save(); render();
    const again = $("#nt-" + d.id); if (again) { again.closest("details").open = true; again.focus(); }
  }
  else if (f.id === "f-sess") {
    const q = +$("#s-q").value || 0, a = Math.min(+$("#s-a").value || 0, q);
    const s = { id:uid(), ts:Date.now(), disc:$("#s-disc").value, data:$("#s-data").value || today(), min:+$("#s-min").value || 0, tipo:$("#s-tipo").value, q, a, obs:$("#s-obs").value.trim() };
    if (!s.min) return;
    S.sessoes.push(s); estudoPre = s.disc; save(); render(); toast("Sessão salva: " + fmtH(s.min));
  }
  else if (f.id === "f-ai") {
    const q = $("#ai-q").value.trim(); if (!q) return;
    askAI("Sua pergunta: " + q, q);
  }
});

initStore();
})();
</script>

</body>
</html>
